<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Learning Portal</title></head>
<body>
<header>

    <h1>Web Development E-Learning Portal</h1>

    <p>
        Learn HTML through audio and video lectures.
    </p>
</header>
<main>
<section>

    <h2>HTML Audio Lecture</h2>

    <audio controls>

        <source
            src="html-lecture.mp3"
            type="audio/mpeg">

        Your browser does not support
        the audio element.

    </audio>
</section>
<hr>
<section>

    <h2>HTML Video Lecture</h2>

    <video
        width="600"
        controls
        poster="html-thumbnail.jpg">

        <source
            src="html-lecture.mp4"
            type="video/mp4">

        Your browser does not support
        the video element.

    </video>
</section>
</main>
<footer>

    <p>
        &copy; 2026 E-Learning Portal
    </p>
</footer>
</body></html>
Keep these files in the same folder:
index.html
html-lecture.mp3
html-lecture.mp4
html-thumbnail.jpg
